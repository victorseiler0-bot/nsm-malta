name: DNS diagnostic
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve via public DoH resolvers
        run: |
          echo "--- Cloudflare DoH ---"
          curl -sS "https://cloudflare-dns.com/dns-query?name=sevmsldqpeczstupletf.supabase.co&type=A" -H "accept: application/dns-json"
          echo ""
          echo "--- Google DoH ---"
          curl -sS "https://dns.google/resolve?name=sevmsldqpeczstupletf.supabase.co&type=A"
          echo ""
          echo "--- supabase.com itself (sanity check, should resolve) ---"
          curl -sS "https://dns.google/resolve?name=supabase.com&type=A"
